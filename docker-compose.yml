services:
  web:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"  # ZMENENÉ - bind len na localhost
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=core.settings
      - DATABASE_URL=postgresql://user:password@db:5432/mydb
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "sleep 10 &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"  # ZMENENÉ - späť na 0.0.0.0

  db:
    image: postgres:18
    environment:
      - POSTGRES_DB=mydb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "127.0.0.1:5432:5432"  # ZMENENÉ - bind len na localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
