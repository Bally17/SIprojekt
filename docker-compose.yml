services:
  web:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DOCKER_CONTAINER=True
    env_file:
      - ./backend/.env
    depends_on:
      - db
    command: >
      sh -c "sleep 10 &&
             python manage.py migrate --fake-initial &&
             python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:18
    environment:
      - POSTGRES_DB=praxy_db
      - POSTGRES_PASSWORD=postgres  # DÔLEŽITÉ - pridajte heslo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
