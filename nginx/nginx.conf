user  nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    # Per-IP rate limit for API
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

    upstream django_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50m;

        # Security headers (non-breaking defaults)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # CSP in report-only mode to avoid breaking functionality; tighten allowlists as needed.
        add_header Content-Security-Policy-Report-Only "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000;" always;

        # Basic compression
        gzip on;
        gzip_types text/css application/javascript application/json application/xml text/plain;
        gzip_min_length 1024;

        location /static/ {
            alias /app/staticfiles/;
            access_log off;
            expires 30d;
        }

        location /media/ {
            return 404;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
