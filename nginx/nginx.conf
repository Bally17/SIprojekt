user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- CORE HARDENING ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    server_tokens off;

    # --- BUFFER & TIMEOUT LIMITS (DoS mitigation) ---
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    client_max_body_size 20m;
    client_body_buffer_size 256k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;

    # --- RATE LIMITING ---
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=3r/s;

    # --- UPSTREAM ---
    upstream django_backend {
        server backend:8000;
        keepalive 32;
    }

    # ============================================================
    # HTTP → HTTPS REDIRECT (if TLS terminates elsewhere, keep this)
    # ============================================================
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ======================
    # MAIN SECURE SERVER
    # ======================
    server {
        listen 443 ssl http2;
        server_name _;

        # --- TLS (example; adapt if certs elsewhere) ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;

        # --- SECURITY HEADERS ---
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self';
            style-src 'self';
            img-src 'self' data:;
            font-src 'self';
            connect-src 'self';
        " always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- GZIP ---
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types
            text/plain
            text/css
            application/json
            application/javascript
            application/xml;

        # --- STATIC FILES ---
        location /static/ {
            alias /app/staticfiles/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # --- BLOCK MEDIA ---
        location /media/ {
            return 404;
        }

        # --- AUTH ENDPOINTS (STRICT RATE LIMIT) ---
        location ~ ^/api/(auth|login|oauth|password) {
            limit_req zone=auth_per_ip burst=5 nodelay;
            proxy_pass http://django_backend;
            include /etc/nginx/proxy_params;
        }

        # --- API ---
        location /api/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            proxy_pass http://django_backend;
            include /etc/nginx/proxy_params;
        }

        # --- EVERYTHING ELSE ---
        location / {
            proxy_pass http://django_backend;
            include /etc/nginx/proxy_params;
        }
    }

    include /etc/nginx/proxy_params;
}
