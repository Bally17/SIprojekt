name: Release pipeline

on:
  push:
    branches:
      - 'release/**'
      - 'release-*'

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/siprojekt-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/siprojekt-frontend
  IMAGE_TAG: release-${{ github.run_number }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Backend – build only
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # ❌ PYTEST ZÁMERNE ODSTRÁNENÝ
      # Release pipeline netestuje – len balí artefakt

      # =========================
      # Frontend
      # =========================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: i18n consistency check
        run: node scripts/i18n-check.mjs
        working-directory: frontend

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
        working-directory: frontend

      - name: Run Jest unit tests
        run: npm test --if-present
        working-directory: frontend

      # =========================
      # Docker / GHCR
      # =========================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:release

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:release
